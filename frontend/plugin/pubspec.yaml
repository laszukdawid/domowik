name: domowik_bridge_plugin
description: >-
  Platform packaging for the Domowik frontend's native Rust bridge.
  Not published as a Dart package; platform validation gates remain open.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

# NO third-party Dart package. The `plugin_ffi` template pulls `ffi`,
# `ffigen`, `plugin_platform_interface` and `flutter_lints`; all four were
# removed. Every one would need a licence, provenance and notice record
# (docs/THIRD-PARTY-POLICY.md), and this spike's whole dependency ledger is
# otherwise empty. The FFI declarations are hand-written and shared with the
# standalone harness rather than generated.
dependencies:
  flutter:
    sdk: flutter
  domowik_bridge_harness:
    path: ../dart_harness

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # `ffiPlugin: true`: the tool builds this directory and bundles what it
      # produces, which is what an FFI core needs. Only macOS also names a
      # `pluginClass`: its 3D presenter (issue 0101) registers the `three-d`
      # channel and a Flutter texture. Linux and Android register nothing;
      # Linux's 3D channel lives in its runner.
      macos:
        ffiPlugin: true
        pluginClass: DomowikScene3DPlugin
      linux:
        ffiPlugin: true
      android:
        ffiPlugin: true
