name: binaries

# Downloadable builds: the only product workflow that runs on its own (ED-0118).
# GitHub-managed Pages builds separately publish docs/ from main (ED-0122).
# Domowik is not production software, so product CI is manual: verification
# is ./scripts/verify.sh on a developer machine before merging, and ci.yml is
# a manual full check. This builds binaries only when asked for:
#
#   - a pushed `v*` tag builds everything and attaches it to a GitHub release;
#   - "Run workflow" (workflow_dispatch) builds everything as run artifacts.
#
# The binaries are UNSIGNED developer builds: the macOS app is not notarized,
# so Gatekeeper asks before first launch. No test or verification runs here;
# the commit is expected to have passed verify.sh already.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Command-line tool for Linux. aarch64 is cross-compiled and never executed
  # on this x86_64 runner.
  cli-linux:
    name: cli ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Rust with target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build -p domowik-cli --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/domowik-cli-${{ matrix.target }}.tar.gz" domowik
          sha256sum dist/*
      # actions/upload-artifact v7.0.2, MIT, tag resolved to this commit on
      # 2026-10-10. Dev-only tool per THIRD-PARTY-POLICY.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  # Editor bundle for Linux x86_64 (GTK; 3D through the native GL runner).
  editor-linux:
    name: editor linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Rust
        run: rustup show active-toolchain || rustup toolchain install
      # subosito/flutter-action v2.23.0, MIT, same reviewed pin as ci.yml.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
          pub-cache: false
      - name: Install Linux editor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libepoxy-dev
          flutter config --enable-linux-desktop
      - name: Build
        working-directory: frontend
        run: flutter build linux --release
      - name: Package
        run: |
          mkdir -p dist
          tar -C frontend/build/linux/x64/release -czf dist/domowik-editor-linux-x86_64.tar.gz bundle
          sha256sum dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-linux-x86_64
          path: dist/*

  # Editor app (universal) and command-line tool for macOS. The most expensive
  # job here: macOS minutes bill at ten times Linux.
  macos:
    name: editor + cli macos
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Both darwin targets: the plugin's podspec builds one Rust slice per
      # Xcode architecture and fails on a missing target (see ci.yml).
      - name: Set up Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
          pub-cache: false
      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
      - name: Build editor
        working-directory: frontend
        run: flutter build macos --release
      - name: Build command-line tool
        run: |
          cargo build -p domowik-cli --locked --release --target aarch64-apple-darwin
          cargo build -p domowik-cli --locked --release --target x86_64-apple-darwin
          lipo -create -output domowik \
            target/aarch64-apple-darwin/release/domowik \
            target/x86_64-apple-darwin/release/domowik
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent frontend/build/macos/Build/Products/Release/domowik_editor.app \
            dist/domowik-editor-macos-universal.zip
          tar -czf dist/domowik-cli-macos-universal.tar.gz domowik
          shasum -a 256 dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-universal
          path: dist/*

  # Tags only: one release holding every archive, marked a prerelease.
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli-linux, editor-linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} . \;
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Domowik $TAG (unsigned developer build)" \
            --notes "Unsigned developer builds; the macOS app is not notarized. Not production software." \
            ./*.tar.gz ./*.zip SHA256SUMS
