name: checks

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "issues/**"
      - "examples/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "issues/**"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks (rust + catalog + flutter)
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Rust
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          cargo --version && rustc --version

      - name: Rust fmt, clippy, and tests
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

      - name: Build FFI bridge and run catalog tests
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
        run: |
          cargo build --manifest-path frontend/Cargo.toml --release --locked -p domowik-frontend-bridge
          test -s frontend/target/release/libdomowik_bridge.so
          python3 -m unittest catalog/test_generate.py

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: false
          pub-cache: false

      - name: Flutter analyze and test
        shell: bash
        env:
          CI: "true"
        run: |
          cd frontend
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=2

  notify-downstream:
    name: notify downstream (domowik-serve)
    needs: [checks]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 20

      - name: Trigger downstream pipeline
        shell: bash
        env:
          DOWNSTREAM_TRIGGER_URL: ${{ secrets.DOWNSTREAM_TRIGGER_URL }}
          DOWNSTREAM_TRIGGER_TOKEN: ${{ secrets.DOWNSTREAM_TRIGGER_TOKEN }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PREV_COMMIT_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          url = os.environ.get("DOWNSTREAM_TRIGGER_URL", "").strip()
          token = os.environ.get("DOWNSTREAM_TRIGGER_TOKEN", "").strip()
          if not url or not token:
              print("Downstream trigger not configured; skipping.")
              sys.exit(0)

          commit = os.environ.get("CI_COMMIT_SHA", "").strip()
          prev = os.environ.get("CI_PREV_COMMIT_SHA", "").strip()
          if not commit:
              commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

          def try_diff(base, head):
              res = subprocess.run(
                  ["git", "diff", "--name-only", f"{base}..{head}"],
                  capture_output=True,
                  text=True,
              )
              if res.returncode == 0:
                  return [line.strip() for line in res.stdout.splitlines() if line.strip()]
              return None

          changed = None
          candidates = []
          if prev and prev != "0" * 40 and prev != commit:
              candidates.append((prev, commit))
          candidates.append((f"{commit}~1", commit))

          for base, head in candidates:
              changed = try_diff(base, head)
              if changed is not None:
                  break

          if changed is None:
              subprocess.run(["git", "fetch", "--depth", "20", "origin", "main"], check=False)
              for base, head in candidates:
                  changed = try_diff(base, head)
                  if changed is not None:
                      break

          if changed is None:
              core_changed = True
              web_changed = True
              catalog_changed = True
          else:
              core_changed = any(
                  p.startswith("crates/") or p in ("Cargo.toml", "Cargo.lock")
                  for p in changed
              )
              web_changed = core_changed or any(
                  p.startswith("frontend/") or p in ("LICENSE", "NOTICE")
                  for p in changed
              )
              catalog_changed = core_changed or any(
                  p.startswith("catalog/")
                  or p.startswith("frontend/native/")
                  or p in ("frontend/Cargo.toml", "frontend/Cargo.lock")
                  for p in changed
              )

          payload = {
              "branch": "main",
              "message": f"upstream: {commit[:8]}",
              "variables": {
                  "UPSTREAM_REV": commit,
                  "UPSTREAM_CORE_CHANGED": "true" if core_changed else "false",
                  "UPSTREAM_WEB_CHANGED": "true" if web_changed else "false",
                  "UPSTREAM_CATALOG_CHANGED": "true" if catalog_changed else "false",
              },
          }
          print(
              f"Triggering downstream pipeline for {commit[:8]} "
              f"(core_changed={core_changed}, web_changed={web_changed}, catalog_changed={catalog_changed})"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = resp.read().decode("utf-8", errors="replace")
              print(f"Downstream trigger accepted: HTTP {resp.status}")
              try:
                  info = json.loads(body)
                  if "number" in info:
                      print(f"Triggered downstream pipeline #{info['number']}")
              except Exception:
                  pass
          PY
