when:
  - event: pull_request
    branch: main
    evaluate: 'CI_COMMIT_PULL_REQUEST_DRAFT != "true"'
    path:
      exclude:
        - "**/*.md"
        - "docs/**"
        - "issues/**"
        - "examples/**"
  - event: push
    branch: main
    path:
      exclude:
        - "**/*.md"
        - "docs/**"
        - "issues/**"
        - "examples/**"

# Steps run sequentially in declaration order so path-gated PR steps can skip
# cleanly without breaking downstream dependencies.
steps:
  - name: build-bridge
    image: rust:1.98.0-slim-bookworm
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
        path:
          - "frontend/**"
          - "crates/**"
          - "catalog/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"
          - ".woodpecker.yml"
    volumes:
      - woodpecker-ci-cache:/cache
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/domowik-ci-bridge-target
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      # CI-only FFI bridge for catalog & Flutter tests; release.yml and profile.web keep fat LTO.
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
      - mkdir -p /cache/cargo /cache/domowik-ci-bridge-target
      - |
        python3 - <<'PY'
        import os, shutil, time
        from pathlib import Path
        active = Path("/cache/domowik-ci-bridge-target")
        (active / ".ci-active").touch()
        u = shutil.disk_usage("/cache")
        pct = u.used * 100 // u.total
        print(f"/cache usage: {pct}%")
        if pct > 82:
            now = time.time()
            for cand in (Path("/cache/domowik-target"), Path("/cache/domowik-frontend-target")):
                if not cand.exists():
                    continue
                newest = cand.stat().st_mtime
                m = cand / ".ci-active"
                if m.exists():
                    newest = max(newest, m.stat().st_mtime)
                if now - newest < 1800:
                    print(f"Skipping active cache {cand}")
                    continue
                print(f"Pruning stale cache {cand}")
                shutil.rmtree(cand, ignore_errors=True)
        PY
      - cargo build --manifest-path frontend/Cargo.toml --release --locked -p domowik-frontend-bridge
      - mkdir -p frontend/target/release
      - cp /cache/domowik-ci-bridge-target/release/libdomowik_bridge.so frontend/target/release/libdomowik_bridge.so
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 3000m
            memory: 3584Mi

  - name: rust-and-catalog
    image: rust:1.98.0-slim-bookworm
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
        path:
          - "crates/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "catalog/**"
          - "frontend/Cargo.toml"
          - "frontend/Cargo.lock"
          - "frontend/native/**"
          - "frontend/renderer/**"
          - "frontend/web-renderer/**"
          - "rust-toolchain.toml"
          - ".woodpecker.yml"
    volumes:
      - woodpecker-ci-cache:/cache
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/domowik-target
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 libcap2-bin && rm -rf /var/lib/apt/lists/*
      - mkdir -p /cache/cargo /cache/domowik-target
      - |
        python3 - <<'PY'
        import shutil, time
        from pathlib import Path
        active = Path("/cache/domowik-target")
        (active / ".ci-active").touch()
        u = shutil.disk_usage("/cache")
        pct = u.used * 100 // u.total
        print(f"/cache usage: {pct}%")
        if pct > 82:
            now = time.time()
            for cand in (Path("/cache/domowik-ci-bridge-target"), Path("/cache/domowik-frontend-target")):
                if not cand.exists():
                    continue
                newest = cand.stat().st_mtime
                m = cand / ".ci-active"
                if m.exists():
                    newest = max(newest, m.stat().st_mtime)
                if now - newest < 1800:
                    print(f"Skipping active cache {cand}")
                    continue
                print(f"Pruning stale cache {cand}")
                shutil.rmtree(cand, ignore_errors=True)
        PY
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --workspace --locked --all-targets -- -D warnings
      - capsh --drop=cap_dac_override,cap_dac_read_search -- -c 'cargo test --workspace --locked'
      - python3 -m unittest catalog/test_generate.py
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 3000m
            memory: 3584Mi

  - name: flutter-test
    image: plugfox/flutter:3.47.7
    when:
      - event: push
        branch: main
      - event: pull_request
        branch: main
        path:
          - "frontend/**"
          - "crates/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - ".woodpecker.yml"
    volumes:
      - woodpecker-ci-cache:/cache
    environment:
      PUB_CACHE: /cache/pub-cache
      DART_VM_OPTIONS: --old_gen_heap_size=1536
      CI: "true"
    commands:
      - apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*
      - mkdir -p /cache/pub-cache
      - cd frontend
      - flutter pub get
      - flutter analyze --no-pub
      - flutter test --no-pub --concurrency=2
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 3000m
            memory: 3584Mi

  - name: notify-downstream
    image: python:3.12-alpine
    when:
      - event: push
        branch: main
    environment:
      DOWNSTREAM_TRIGGER_URL:
        from_secret: downstream_trigger_url
      DOWNSTREAM_TRIGGER_TOKEN:
        from_secret: downstream_trigger_token
    commands:
      - apk add --no-cache git
      - |
        python3 - <<'PY'
        import json
        import os
        import subprocess
        import sys
        import urllib.request

        url = os.environ.get("DOWNSTREAM_TRIGGER_URL", "").strip()
        token = os.environ.get("DOWNSTREAM_TRIGGER_TOKEN", "").strip()
        if not url or not token:
            print("Downstream trigger not configured; skipping.")
            sys.exit(0)

        commit = os.environ.get("CI_COMMIT_SHA", "").strip()
        prev = os.environ.get("CI_PREV_COMMIT_SHA", "").strip()
        if not commit:
            commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()

        def try_diff(base, head):
            res = subprocess.run(
                ["git", "diff", "--name-only", f"{base}..{head}"],
                capture_output=True,
                text=True,
            )
            if res.returncode == 0:
                return [line.strip() for line in res.stdout.splitlines() if line.strip()]
            return None

        changed = None
        candidates = []
        if prev and prev != "0" * 40 and prev != commit:
            candidates.append((prev, commit))
        candidates.append((f"{commit}~1", commit))

        for base, head in candidates:
            changed = try_diff(base, head)
            if changed is not None:
                break

        if changed is None:
            subprocess.run(["git", "fetch", "--depth", "20", "origin", "main"], check=False)
            for base, head in candidates:
                changed = try_diff(base, head)
                if changed is not None:
                    break

        if changed is None:
            core_changed = True
            web_changed = True
            catalog_changed = True
        else:
            core_changed = any(
                p.startswith("crates/") or p in ("Cargo.toml", "Cargo.lock")
                for p in changed
            )
            web_changed = core_changed or any(
                p.startswith("frontend/") or p in ("LICENSE", "NOTICE")
                for p in changed
            )
            catalog_changed = core_changed or any(
                p.startswith("catalog/")
                or p.startswith("frontend/native/")
                or p in ("frontend/Cargo.toml", "frontend/Cargo.lock")
                for p in changed
            )

        payload = {
            "branch": "main",
            "message": f"upstream: {commit[:8]}",
            "variables": {
                "UPSTREAM_REV": commit,
                "UPSTREAM_CORE_CHANGED": "true" if core_changed else "false",
                "UPSTREAM_WEB_CHANGED": "true" if web_changed else "false",
                "UPSTREAM_CATALOG_CHANGED": "true" if catalog_changed else "false",
            },
        }
        print(
            f"Triggering downstream pipeline for {commit[:8]} "
            f"(core_changed={core_changed}, web_changed={web_changed}, catalog_changed={catalog_changed})"
        )
        req = urllib.request.Request(
            url,
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/json",
            },
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=30) as resp:
            body = resp.read().decode("utf-8", errors="replace")
            print(f"Downstream trigger accepted: HTTP {resp.status}")
            try:
                info = json.loads(body)
                if "number" in info:
                    print(f"Triggered downstream pipeline #{info['number']}")
            except Exception:
                pass
        PY
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
