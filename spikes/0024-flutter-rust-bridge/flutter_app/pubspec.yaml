name: domowik_spike_app
description: >-
  Spike application for issue 0024: a Flutter macOS app that drives the
  Domowik Rust core through dart:ffi from inside its own bundle. Not a product
  component and not published.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.4

# NO third-party Dart package, matching the rest of the spike. `cupertino_icons`
# came with the template and was removed: an icon font is not needed to prove a
# native boundary, and every dependency needs a licence and notice record
# (docs/THIRD-PARTY-POLICY.md).
dependencies:
  flutter:
    sdk: flutter
  domowik_bridge_plugin:
    path: ../flutter_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
