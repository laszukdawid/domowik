# Spike crate for issue 0024. NOT part of the distributed build graph.
#
# Its own workspace, excluded from the root one, with path dependencies on the
# core crates. A spike that sits in the distributed graph acquires a
# compatibility obligation it was never meant to carry (ED-0097); a spike
# outside CI rots into a false record of what once worked, so
# `scripts/verify.sh` builds and tests this anyway.
[workspace]

[package]
name = "domowik-bridge-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false

[lib]
name = "domowik_bridge"
# `cdylib` is what the C and plain-Dart harnesses load with dlopen. `rlib` is
# what the crate's own tests link. `staticlib` is what the Flutter macOS build
# needs: CocoaPods links it INTO the plugin framework, so the app ships one
# signed framework with an `@rpath` id that Xcode sets, instead of a loose
# dylib whose install name points at the developer's build directory.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
domowik-container = { path = "../../crates/domowik-container" }
domowik-document = { path = "../../crates/domowik-document" }
domowik-edit = { path = "../../crates/domowik-edit" }
domowik-format = { path = "../../crates/domowik-format" }
domowik-geometry = { path = "../../crates/domowik-geometry" }
serde = { version = "1.0", features = ["derive"] }
# serde_json: the same `float_roundtrip` bit-preservation fix as the root
# workspace — see its comment for what the defect does and does not cost —
# stated here as DEFENCE IN DEPTH rather than necessity. The difference matters
# and was measured rather than reasoned about.
#
# This is a separate Cargo workspace, so the expectation was that the root
# workspace's feature selection could not reach it. That is FALSE: this spike
# depends on the core crates by path, they declare serde_json with
# `workspace = true`, and Cargo unifies features across one build graph. The
# full truth table, run four ways against the test below:
#
#   root ON,  spike ON  -> pass        root ON,  spike off -> pass
#   root off, spike ON  -> pass        root off, spike off -> FAIL
#
# So EITHER line suffices today and neither is redundant tomorrow: this one
# keeps the FFI save-and-open path correct if the spike ever stops depending on
# the root crates, or if the root line is edited by someone who does not know
# this graph exists. It is the build behind a user's actual file, so it states
# its own requirement instead of inheriting one silently.
#
# `unbounded_depth` is deliberately NOT set here: issue 0004's L11 enforcement
# lives in the reader in the root workspace, and enabling an unused feature in
# a second graph would imply this build does something it does not.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# The boundary must TRANSPORT panics, not abort the host process. `abort` here
# would make `catch_unwind` useless and take a GUI down with one bad request.
panic = "unwind"
