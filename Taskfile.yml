version: '3'

# rustc peaks at roughly 2 GB per job; the default one-job-per-core build
# exhausted RAM and swap on a 12-core machine. Mirrors .cargo/config.toml but
# also covers cargo invoked by the frontend tooling. Override when headroom
# allows, e.g. `CARGO_BUILD_JOBS=8 task test`.
env:
  CARGO_BUILD_JOBS: '{{.CARGO_BUILD_JOBS | default "4"}}'

tasks:
  run:
    desc: Build and run the domowik CLI
    cmds:
      - cargo run --locked --bin domowik -- {{.CLI_ARGS}}

  run:gui:linux:
    desc: Run the Domowik editor on Linux desktop with NVIDIA PRIME offloading
    dir: frontend
    env:
      GDK_BACKEND: x11
      __NV_PRIME_RENDER_OFFLOAD: '1'
      __GLX_VENDOR_LIBRARY_NAME: nvidia
    vars:
      FLUTTER_BIN:
        sh: |
          cached="${XDG_CACHE_HOME:-$HOME/.cache}/domowik-tools/flutter-3.47.7/bin/flutter"
          if [ -n "${DOMOWIK_FLUTTER:-}" ]; then
            printf '%s\n' "$DOMOWIK_FLUTTER"
          elif [ -x "$cached" ]; then
            printf '%s\n' "$cached"
          else
            command -v flutter
          fi
    cmds:
      - 'PATH="$(dirname "{{.FLUTTER_BIN}}"):$PATH" "{{.FLUTTER_BIN}}" run -d linux {{.CLI_ARGS}}'

  run:gui:web:
    desc: Build the browser editor and serve it on http://127.0.0.1:8080 (issue 0088)
    dir: frontend
    cmds:
      - ./scripts/build-web.sh
      - 'echo "Open http://127.0.0.1:8080 (3D needs a browser with WebGPU). Ctrl+C stops the server."'
      - python3 -m http.server 8080 --bind 127.0.0.1 -d build/web

  run:gui:web-browser:
    desc: Build and serve the Linux web editor and open isolated Chromium (Intel/Vulkan/X11)
    dir: frontend
    cmds:
      - ./scripts/build-web.sh
      - ./scripts/run-web-browser.sh

  test:web:
    desc: Browser editor tests in headless Chrome for Testing, then the release-build probe
    dir: frontend
    cmds:
      - ./scripts/test-web.sh
      - ./scripts/build-web.sh
      - ./scripts/web-probe.sh

  benchmark:
    desc: Benchmark the release desktop editor and write a CONFIDENTIAL report to private/benchmarks/
    cmds:
      - ./scripts/benchmark.sh {{.CLI_ARGS}}

  benchmark:summary:
    desc: Print a benchmark run's health checks without timings or machine details, safe to post publicly
    cmds:
      - python3 scripts/benchmark_report.py public-summary {{.CLI_ARGS}}

  benchmark:compare:
    desc: 'Compare two benchmark runs, e.g. task benchmark:compare -- private/benchmarks/A private/benchmarks/B'
    cmds:
      - python3 scripts/benchmark_report.py compare {{.CLI_ARGS}}

  test:
    desc: Run all Rust tests
    cmds:
      - cargo test --workspace --locked
