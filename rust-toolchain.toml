[toolchain]
# Latest stable at the time of the rewrite. Pinned rather than tracking
# "stable" so a CI runner and a developer machine compile identical code.
channel = "1.98.0"
components = ["rustfmt", "clippy"]
# The browser editor (issue 0088): the core for wasm32-wasip1 and the WebGPU
# renderer for wasm32-unknown-unknown. Listed so rustup installs them with
# the toolchain instead of failing the first browser build.
targets = ["wasm32-wasip1", "wasm32-unknown-unknown"]
